<!DOCTYPE html>

<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | Inventory Pro</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed": "#001a42",
                      "tertiary-fixed-dim": "#adc6ff",
                      "outline-variant": "#c5c6cd",
                      "on-surface-variant": "#45474c",
                      "on-primary-container": "#8590a6",
                      "on-error": "#ffffff",
                      "error": "#ba1a1a",
                      "secondary": "#006c49",
                      "surface-container": "#e5eeff",
                      "on-tertiary-fixed-variant": "#004395",
                      "inverse-primary": "#bcc7de",
                      "on-primary": "#ffffff",
                      "surface-container-highest": "#d3e4fe",
                      "primary-fixed": "#d8e3fb",
                      "on-background": "#0b1c30",
                      "primary-container": "#1e293b",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "surface-container-high": "#dce9ff",
                      "on-tertiary-container": "#4c8dff",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-fixed-variant": "#005236",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#00714d",
                      "on-primary-fixed-variant": "#3c475a",
                      "tertiary-container": "#00275b",
                      "secondary-fixed-dim": "#4edea3",
                      "on-primary-fixed": "#111c2d",
                      "inverse-on-surface": "#eaf1ff",
                      "secondary-fixed": "#6ffbbe",
                      "primary-fixed-dim": "#bcc7de",
                      "background": "#f8f9ff",
                      "on-secondary-fixed": "#002113",
                      "tertiary": "#001334",
                      "inverse-surface": "#213145",
                      "on-surface": "#0b1c30",
                      "surface-variant": "#d3e4fe",
                      "surface": "#f8f9ff",
                      "surface-container-low": "#eff4ff",
                      "surface-dim": "#cbdbf5",
                      "outline": "#75777d",
                      "tertiary-fixed": "#d8e2ff",
                      "on-error-container": "#93000a",
                      "secondary-container": "#6cf8bb",
                      "primary": "#091426",
                      "surface-tint": "#545f73"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "lg": "2rem",
                      "container-max": "1440px",
                      "base": "4px",
                      "xs": "0.5rem",
                      "xl": "3rem",
                      "sm": "1rem",
                      "md": "1.5rem",
                      "gutter": "1.5rem"
              },
              "fontFamily": {
                      "body-md": ["Public Sans"],
                      "body-lg": ["Public Sans"],
                      "label-lg": ["Public Sans"],
                      "display": ["Public Sans"],
                      "headline-lg-mobile": ["Public Sans"],
                      "headline-lg": ["Public Sans"],
                      "label-md": ["Public Sans"],
                      "headline-md": ["Public Sans"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-lg": ["16px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "16px", "fontWeight": "600"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #f8f9ff;
        }
        .login-card {
            background-color: #ffffff;
            border: 1px solid #E2E8F0;
            box-shadow: 0px 10px 15px -3px rgba(15, 23, 42, 0.05);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-gutter">
<!-- Focused Login Container -->
<main class="w-full max-w-[480px]">
    <!-- Brand Identity Header -->
    <div class="text-center mb-xl">
        <h1 class="font-headline-lg text-headline-lg text-primary font-extrabold tracking-tight">
            Inventory Pro
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
            Enterprise Logistics Management
        </p>
    </div>
    <!-- Login Card -->
    <section class="login-card rounded-xl p-lg md:p-xl">
        <header class="mb-lg">
            <h2 class="font-display text-display text-on-surface">
                Welcome back
            </h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
                Please enter your details to sign in
            </p>
        </header>
        <!-- Sign In Form -->
        <form class="space-y-md" id="loginForm" onsubmit="return false;">
            <!-- Email Field -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-lg text-label-lg text-on-surface" for="email">
                    Email address
                </label>
                <div class="relative">
                    <input class="w-full h-[48px] px-md py-sm bg-surface-bright border border-outline-variant rounded-lg text-body-md focus:outline-none focus:ring-2 focus:ring-on-tertiary-container focus:ring-offset-2 transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
                </div>
            </div>
            <!-- Password Field -->
            <div class="flex flex-col gap-xs">
                <label class="font-label-lg text-label-lg text-on-surface" for="password">
                    Password
                </label>
                <div class="relative">
                    <input class="w-full h-[48px] px-md py-sm bg-surface-bright border border-outline-variant rounded-lg text-body-md focus:outline-none focus:ring-2 focus:ring-on-tertiary-container focus:ring-offset-2 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                    <button aria-label="Toggle password visibility" class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
                        <span class="material-symbols-outlined" data-icon="visibility" id="passwordIcon">visibility</span>
                    </button>
                </div>
            </div>
            <!-- Remember & Forgot Row -->
            <div class="flex items-center justify-between pt-xs">
                <label class="flex items-center gap-xs cursor-pointer group">
                    <input class="w-5 h-5 rounded border-outline-variant text-secondary focus:ring-secondary transition-all" type="checkbox"/>
                    <span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">
                            Remember me
                        </span>
                </label>
                <a class="font-label-md text-label-md text-on-tertiary-fixed-variant hover:underline underline-offset-4" href="#">
                    Forgot password?
                </a>
            </div>
            <!-- Action Button -->
            <button class="w-full h-[56px] mt-lg bg-secondary hover:bg-on-secondary-fixed-variant text-white font-label-lg text-label-lg rounded-lg shadow-sm active:opacity-90 transition-all flex items-center justify-center gap-sm" type="submit">
                Sign In
                <span class="material-symbols-outlined" data-icon="login">login</span>
            </button>
        </form>
    </section>
    <!-- Optional Footer / Registration Link -->
    <footer class="mt-xl text-center">
        <p class="font-body-md text-body-md text-on-surface-variant">
            Don't have an account?
            <a class="text-secondary font-bold hover:underline underline-offset-4" href="#">Contact your administrator</a>
        </p>
        <div class="mt-lg flex justify-center gap-md opacity-60">
            <a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface" href="#">Privacy Policy</a>
            <span class="text-outline-variant">•</span>
            <a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface" href="#">Terms of Service</a>
        </div>
    </footer>
</main>
<!-- Visual Background Element (Subtle) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] rounded-full bg-surface-container opacity-50 blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[600px] h-[600px] rounded-full bg-surface-container opacity-30 blur-3xl"></div>
</div>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('passwordIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            passwordInput.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    // Simple button interaction feedback
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        const btn = e.target.querySelector('button[type="submit"]');
        const originalContent = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Authenticating...';

        setTimeout(() => {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            alert('In a real application, this would authenticate the user.');
        }, 1500);
    });
</script>
</body></html>
